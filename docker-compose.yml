version: '3.8'

services:
  # ---------------- 基础依赖层 ----------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: financial_rag
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/adminpassword
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  # ---------------- 应用层 ----------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
        - ./models:/app/models  # 🌟 挂载模型缓存目录
        - ./data:/app/data      # 🌟 挂载我们之前写的 PDF 解析和上传目录
    environment:
      - POSTGRES_URL=postgresql://admin:adminpassword@postgres:5432/financial_rag
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URL=bolt://neo4j:7687
      - ES_URL=http://elasticsearch:9200
      # 注意：访问宿主机的 Ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LANGFUSE_HOST=http://langfuse-server:3000
      # 🌟 必须和 langfuse-server 项目里的 key 一致，否则上报 401/404、后台看不到数据
      - LANGFUSE_PUBLIC_KEY=pk-lf-7165d8d5-3028-4cbe-9b7d-d6814cace07c
      - LANGFUSE_SECRET_KEY=sk-lf-62ca472d-73c2-4502-b7c2-6bd53e5c8598
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
      - qdrant
      - neo4j
      - elasticsearch

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
        - ./models:/app/models
        - ./data:/app/data
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info
    environment:
      - POSTGRES_URL=postgresql://admin:adminpassword@postgres:5432/financial_rag
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URL=bolt://neo4j:7687
      - ES_URL=http://elasticsearch:9200
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - LANGFUSE_HOST=http://langfuse-server:3000
      # 🌟 必须和 langfuse-server 项目里的 key 一致，否则上报 401/404、后台看不到数据
      - LANGFUSE_PUBLIC_KEY=pk-lf-7165d8d5-3028-4cbe-9b7d-d6814cace07c
      - LANGFUSE_SECRET_KEY=sk-lf-62ca472d-73c2-4502-b7c2-6bd53e5c8598
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      - API_BASE_URL=http://backend:8001
    ports:
      - "8501:8501"
    depends_on:
      - backend


    # ---------------- 监控层：Langfuse ----------------
  langfuse-server:
    image: langfuse/langfuse:2
    depends_on:
      - postgres
    ports:
       - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@postgres:5432/postgres
      - NEXTAUTH_SECRET=mysecret
      - SALT=mysalt
      - NEXTAUTH_URL=http://localhost:3000
      - TELEMETRY_ENABLED=false
      - LANGFUSE_PUBLIC_KEY=pk-lf-7165d8d5-3028-4cbe-9b7d-d6814cace07c
      - LANGFUSE_SECRET_KEY=sk-lf-62ca472d-73c2-4502-b7c2-6bd53e5c8598
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  es_data: